<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
  </head>
  <body>
    <main>
      <h1>URL Shortener</h1>
      <form>
        <label for="url">Enter a long URL</label>
        <input id="url" type="url" placeholder="https://example.com" required />
        <button type="submit">Shorten</button>
      </form>
    </main>
    <section aria-live="polite">
      <h2>Your short link</h2>
      <p id="result">No link generated yet.</p>
    </section>
  </main>
  <footer>
    <small>© My Project</small>
  </footer>
  <!-- Add JS when ready: <script src="js/main.js"></script> -->
</body>
</html>
