<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>URL Shortener</h1>
      <form>
        <label for="url">Enter a long URL</label>
        <div class="input-row">
          <input id="url" type="url" autocomplete="url" placeholder="https://example.com" required />
          <button type="submit">Shorten</button>
        </div>
        <div class="alias-row">
          <label for="custom-alias">Custom short code (optional)</label>
          <input id="custom-alias" type="text" maxlength="20" placeholder="github" />
        </div>
      </form>
    </main>
    <section class="result-panel" aria-live="polite">
      <h2>Your short link</h2>
      <p id="result">No link generated yet.</p>
      <div class="result-actions">
        <button id="copy-button" type="button" disabled>Copy link</button>
        <span id="copy-status" role="status"></span>
      </div>
    </section>
    <section class="history-panel" aria-labelledby="history-title">
      <div class="history-heading">
        <h2 id="history-title">Link history</h2>
        <div class="stats" aria-label="Link statistics">
          <span><strong id="link-count">0</strong> links</span>
          <span><strong id="click-count">0</strong> clicks</span>
          <span><strong id="today-click-count">0</strong> today</span>
        </div>
      </div>
      <p id="history-empty">Your shortened links will appear here.</p>
      <ul id="history-list"></ul>
    </section>
  </body>
</html>
